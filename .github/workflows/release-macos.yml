# Builds the macOS bundle (packaging/build_bundle.py) and attaches it to each published release, beside the Windows zip (release-windows.yml).
name: macOS release

on:
  release:
    types: [published]
  workflow_dispatch:   # a test build of the branch, kept as the run's artifact

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags: git describe names the bundle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover tests
      - run: python packaging/build_bundle.py
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/nx2android-*-macos-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nx2android-macos
          path: dist/nx2android-*-macos-*.zip
