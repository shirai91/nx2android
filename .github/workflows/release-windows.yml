# Builds the Windows bundle (packaging/build_bundle.py) and attaches it to each published release, beside the macOS zip (release-macos.yml).
name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:   # a test build of the branch, kept as the run's artifact

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # PowerShell does not expand the zip's glob for gh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags: git describe names the bundle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'   # the Python the hand-built Windows zips shipped with
      - run: python -m pip install -r requirements.txt pyinstaller
      # after pip, which installs the prebuilt launcher: build_bundle.py refuses it (antivirus engines flag it); waf finds the runner's Visual Studio
      - run: python packaging/build_bootloader.py
      - run: python -m unittest discover tests
      - run: python packaging/build_bundle.py
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/nx2android-*-windows-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nx2android-windows
          path: dist/nx2android-*-windows-*.zip
