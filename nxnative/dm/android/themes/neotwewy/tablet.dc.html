<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEO: The World Ends with You — Tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&amp;display=swap">
<style>
body{margin:0;background:#0d0d0f}
a{color:#f4f4f4}a:hover{color:#f4f4f4}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #ffe600;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 1216px; height: 760px; overflow: hidden; background: #0d0d0f; font-family: 'Bebas Neue', sans-serif; color: #f4f4f4; touch-action: none; user-select: none; -webkit-user-select: none">

<!-- Backdrop -->
<svg aria-hidden="true" width="1216" height="760" viewBox="0 0 1216 760" style="position: absolute; left: 0; top: 0">
<defs>
<pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.6" fill="#1d1d24"></circle></pattern>
</defs>
<rect width="1216" height="760" fill="url(#halftone)"></rect>
<circle cx="146" cy="547" r="90" fill="#ff2e88" opacity="0.28"></circle><circle cx="218" cy="520" r="40" fill="#ff2e88" opacity="0.28"></circle><circle cx="83" cy="583" r="36" fill="#ff2e88" opacity="0.28"></circle><circle cx="173" cy="624" r="27" fill="#ff2e88" opacity="0.28"></circle><circle cx="110" cy="471" r="25" fill="#ff2e88" opacity="0.28"></circle><circle cx="263" cy="592" r="14" fill="#ff2e88" opacity="0.28"></circle><circle cx="38" cy="493" r="11" fill="#ff2e88" opacity="0.28"></circle>
<circle cx="1070" cy="213" r="81" fill="#18d8ff" opacity="0.25"></circle><circle cx="1135" cy="188" r="36" fill="#18d8ff" opacity="0.25"></circle><circle cx="1013" cy="245" r="32" fill="#18d8ff" opacity="0.25"></circle><circle cx="1094" cy="282" r="24" fill="#18d8ff" opacity="0.25"></circle><circle cx="1038" cy="144" r="23" fill="#18d8ff" opacity="0.25"></circle><circle cx="1175" cy="253" r="12" fill="#18d8ff" opacity="0.25"></circle><circle cx="973" cy="164" r="10" fill="#18d8ff" opacity="0.25"></circle>
<circle cx="608" cy="722" r="72" fill="#ffe600" opacity="0.22"></circle><circle cx="666" cy="700" r="32" fill="#ffe600" opacity="0.22"></circle><circle cx="558" cy="751" r="29" fill="#ffe600" opacity="0.22"></circle><circle cx="630" cy="783" r="22" fill="#ffe600" opacity="0.22"></circle><circle cx="579" cy="661" r="20" fill="#ffe600" opacity="0.22"></circle><circle cx="702" cy="758" r="11" fill="#ffe600" opacity="0.22"></circle><circle cx="522" cy="679" r="9" fill="#ffe600" opacity="0.22"></circle>
<circle cx="1046" cy="654" r="45" fill="#ff2e88" opacity="0.2"></circle><circle cx="1082" cy="640" r="20" fill="#ff2e88" opacity="0.2"></circle><circle cx="1014" cy="672" r="18" fill="#ff2e88" opacity="0.2"></circle><circle cx="1059" cy="692" r="14" fill="#ff2e88" opacity="0.2"></circle><circle cx="1028" cy="615" r="13" fill="#ff2e88" opacity="0.2"></circle><circle cx="1104" cy="676" r="7" fill="#ff2e88" opacity="0.2"></circle><circle cx="992" cy="627" r="5" fill="#ff2e88" opacity="0.2"></circle>
<g transform="rotate(-4 608 718)">
<rect x="-20" y="703" width="1256" height="26" fill="#ffe600"></rect>
<rect x="-20" y="703" width="1256" height="26" fill="none" stroke="#0d0d0f" stroke-width="2"></rect>
<line x1="-20" y1="716" x2="1236" y2="716" stroke="#0d0d0f" stroke-width="8" stroke-dasharray="26 26"></line>
</g>
</svg>

<!-- Full-screen game placeholder -->
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 5px; color: #f4f4f4; opacity: 0.8">[ FULL-SCREEN GAME ]</span>
</div>
<sc-if value="{{showZones}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="1216" height="760" viewBox="0 0 1216 760" style="position: absolute; left: 0; top: 0">
<circle cx="0" cy="520" r="230" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="220"></circle><circle cx="0" cy="520" r="385" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="90"></circle><circle cx="0" cy="520" r="340" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="0" cy="520" r="430" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle><circle cx="1216" cy="520" r="230" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="220"></circle><circle cx="1216" cy="520" r="385" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="90"></circle><circle cx="1216" cy="520" r="340" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="1216" cy="520" r="430" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle>
</svg>
</sc-if>

<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 438px; top: 56px; width: 340px; height: 62px; box-sizing: border-box; padding: 7px 16px; border: 3px solid #0d0d0f; border-radius: 3px; background: #f4f4f4; box-shadow: 5px 5px 0 #ff2e88; display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #0d0d0f">INPUT</span>
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #0d0d0f">STREAK ×{{stokes}}</span>
</div>
<span style="font-family: 'Permanent Marker', cursive; font-size: 23px; font-weight: 700; letter-spacing: 1px; line-height: 27px; white-space: nowrap; overflow: hidden; color: #c4005e">{{last}}</span>
</div>

<!-- Emulator settings: small oval, drag to move, tap to open -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 570px; top: 6px; width: 76px; height: 44px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 60px; height: 28px; box-sizing: border-box; border: 2px solid #0d0d0f; border-radius: 999px; background: #f4f4f4; box-shadow: 2px 3px 0 #ff2e88; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #0d0d0f"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #0d0d0f"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #0d0d0f"></span></span>
</span>
</button>

<!-- System buttons (small, out of the thumb's hot zone) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 40px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #0d0d0f; border-radius: 50%; background: #f4f4f4; box-shadow: 2px 3px 0 #ff2e88; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 23px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.MINUS.g}}"></span>
<span style="position: relative; margin-top: 2px">−</span>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 1128px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #0d0d0f; border-radius: 50%; background: #f4f4f4; box-shadow: 2px 3px 0 #ff2e88; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 23px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.PLUS.g}}"></span>
<span style="position: relative; margin-top: 2px">+</span>
</span>
</button>

<!-- Shoulders: on the thumb arc, above each cluster -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 24px; top: 250px; width: 112px; height: 56px; padding: 0; border: 2px solid #0d0d0f; border-radius: 2px; background: #ffe600; box-shadow: 4px 4px 0 #ff2e88; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 28px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: skewX(-8deg) translateY({{p.ZL.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZL.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(8deg); ">ZL</span>
</button>
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 144px; top: 250px; width: 128px; height: 56px; padding: 0; border: 2px solid #0d0d0f; border-radius: 2px; background: #f4f4f4; box-shadow: 4px 4px 0 #ff2e88; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 24px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: skewX(-8deg) translateY({{p.L.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(8deg); ">L</span>
</button>
<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 1080px; top: 250px; width: 112px; height: 56px; padding: 0; border: 2px solid #0d0d0f; border-radius: 2px; background: #ffe600; box-shadow: 4px 4px 0 #ff2e88; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 28px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: skewX(8deg) translateY({{p.ZR.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZR.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(-8deg); ">ZR</span>
</button>
<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 944px; top: 250px; width: 128px; height: 56px; padding: 0; border: 2px solid #0d0d0f; border-radius: 2px; background: #f4f4f4; box-shadow: 4px 4px 0 #ff2e88; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 24px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: skewX(8deg) translateY({{p.R.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.R.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(-8deg); ">R</span>
</button>

<!-- Left thumb: stick at rest, D-pad inner-low, L3 beside the stick -->
<button type="button" aria-label="Left stick" onPointerDown="{{ls.h.down}}" onPointerMove="{{ls.h.move}}" onPointerUp="{{ls.h.up}}" onPointerCancel="{{ls.h.up}}" style="position: absolute; left: 68px; top: 348px; width: 184px; height: 184px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed #f4f4f4; opacity: 0.3"></span>
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 164px; height: 164px; border-radius: 50%; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 66%); opacity: {{ls.o}}"></span>
<svg aria-hidden="true" width="136" height="136" viewBox="0 0 120 120" style="position: absolute; left: 24px; top: 24px; transform: rotate({{ls.r}}deg)">
<circle cx="60" cy="60" r="57" fill="#121216" stroke="#f4f4f4" stroke-width="2.5"></circle>
<circle cx="60" cy="60" r="24" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="28" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="32" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="36" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="40" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="44" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="48" fill="none" stroke="#26262e" stroke-width="1"></circle><circle cx="60" cy="60" r="52" fill="none" stroke="#26262e" stroke-width="1"></circle>
<path d="M30 30 A42 42 0 0 1 72 18" fill="none" stroke="#3a3a46" stroke-width="3" stroke-linecap="round"></path>
<circle cx="60" cy="60" r="19" fill="#ff2e88"></circle>
<rect x="46" y="54" width="28" height="4" fill="#0d0d0f" opacity="0.6"></rect>
<circle cx="60" cy="60" r="3" fill="#0d0d0f"></circle>
</svg>
<span aria-hidden="true" style="position: absolute; left: 63px; top: 63px; width: 58px; height: 58px; box-sizing: border-box; border-radius: 50%; border: 3px solid #0d0d0f; background: #f4f4f4; box-shadow: inset 0 0 0 6px {{accent}}, 0 0 {{ls.glow}}px {{accent}}, 3px 4px 0 #000000; transform: translate({{ls.x}}px, {{ls.y}}px)">
<span style="position: absolute; left: 22px; top: 22px; width: 8px; height: 8px; border-radius: 50%; background: #0d0d0f"></span>
</span>
</button>
<sc-if value="{{showCaptions}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 92px; top: 512px; width: 136px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 17px; font-weight: 400; letter-spacing: 3px; color: #f4f4f4">L-STICK</span>
</sc-if>
<span aria-hidden="true" style="position: absolute; left: 323px; top: 573px; width: 14px; height: 14px; border-radius: 50%; background: #ffe600"></span>
<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 303px; top: 494px; width: 54px; height: 54px; padding: 0; border: 2px solid #f4f4f4; border-radius: 3px; background: #1a1a1f; box-shadow: 3px 3px 0 #ff2e88; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.UP.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.UP.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="11,4 19,16 3,16" fill="#f4f4f4"></polygon></svg>
</button>
<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 303px; top: 612px; width: 54px; height: 54px; padding: 0; border: 2px solid #f4f4f4; border-radius: 3px; background: #1a1a1f; box-shadow: 3px 3px 0 #ff2e88; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.DOWN.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.DOWN.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="11,18 19,6 3,6" fill="#f4f4f4"></polygon></svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 244px; top: 553px; width: 54px; height: 54px; padding: 0; border: 2px solid #f4f4f4; border-radius: 3px; background: #1a1a1f; box-shadow: 3px 3px 0 #ff2e88; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.LEFT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.LEFT.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="4,11 16,3 16,19" fill="#f4f4f4"></polygon></svg>
</button>
<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 362px; top: 553px; width: 54px; height: 54px; padding: 0; border: 2px solid #f4f4f4; border-radius: 3px; background: #1a1a1f; box-shadow: 3px 3px 0 #ff2e88; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.RIGHT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.RIGHT.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polygon points="18,11 6,3 6,19" fill="#f4f4f4"></polygon></svg>
</button>
<button type="button" aria-label="L3, left stick click" onPointerDown="{{h.L3.down}}" onPointerUp="{{h.L3.up}}" onPointerCancel="{{h.L3.up}}" onClick="{{h.L3.click}}" style="position: absolute; left: 276px; top: 360px; width: 52px; height: 52px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L3.y}}px)">
<span style="position: absolute; left: 3px; top: 3px; width: 46px; height: 46px; box-sizing: border-box; border: 3px solid #0d0d0f; border-radius: 50%; background: #d9d9df; box-shadow: 3px 4px 0 #000000; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 400; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; inset: 3px; border-radius: 50%; border: 2px solid #f4f4f4; opacity: 0.9"></span>
<span aria-hidden="true" style="position: absolute; left: 20%; top: 5px; width: 30%; height: 4px; border-radius: 99px; background: #ffffff; opacity: 0.6; transform: rotate(-20deg)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L3.g}}"></span>
<span style="position: relative; ">L3</span>
</span>
</button>

<!-- Right thumb: A/B/X/Y at rest, right stick inner-low, R3 beside it -->
<svg aria-hidden="true" width="228" height="228" viewBox="0 0 200 200" style="position: absolute; left: 932px; top: 316px">
<circle cx="100" cy="100" r="48" fill="#ff2e88" opacity="0.18"></circle><circle cx="138" cy="86" r="22" fill="#ff2e88" opacity="0.18"></circle><circle cx="66" cy="119" r="19" fill="#ff2e88" opacity="0.18"></circle><circle cx="114" cy="141" r="14" fill="#ff2e88" opacity="0.18"></circle><circle cx="81" cy="59" r="13" fill="#ff2e88" opacity="0.18"></circle><circle cx="162" cy="124" r="7" fill="#ff2e88" opacity="0.18"></circle><circle cx="42" cy="71" r="6" fill="#ff2e88" opacity="0.18"></circle>
</svg>
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 1012px; top: 334px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 68px; height: 68px; box-sizing: border-box; border: 3px solid #0d0d0f; border-radius: 50%; background: #18d8ff; box-shadow: 3px 4px 0 #000000; color: #0d0d0f; font-family: 'Bebas Neue', sans-serif; font-size: 32px; font-weight: 400; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 2px solid #f4f4f4; opacity: 0.9"></span>
<span aria-hidden="true" style="position: absolute; left: 20%; top: 7px; width: 30%; height: 6px; border-radius: 99px; background: #ffffff; opacity: 0.6; transform: rotate(-20deg)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.X.g}}"></span>
<span style="position: relative; ">X</span>
</span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff2e88","options":["#ff2e88","#ffe600","#18d8ff","#a6ff00"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":1216,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 184;
    this.stickTravel = 39;
    this.state = { held: {}, last: 'DAY ONE', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 76;
    this.menuBounds = [-570, 570, -6, 710];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#ff2e88';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.45 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 4.20).toFixed(1), glow: on ? 22 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
