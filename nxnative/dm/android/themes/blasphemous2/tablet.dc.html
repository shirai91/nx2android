<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 438px; top: 56px; width: 340px; height: 62px; box-sizing: border-box; padding: 7px 16px; border: 2px solid #c9a24a; border-radius: 3px; background: #1f1512; box-shadow: 0 4px 0 #060302; display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'IM Fell English SC', serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #b9a88a">INPUT</span>
<span style="font-family: 'IM Fell English SC', serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #b9a88a">FERVOUR ×{{stokes}}</span>
</div>
<span style="font-family: 'IM Fell English SC', serif; font-size: 23px; font-weight: 700; letter-spacing: 1px; line-height: 27px; white-space: nowrap; overflow: hidden; color: {{accent}}">{{last}}</span>
</div>

<!-- Emulator settings: small oval, drag to move, tap to open -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 570px; top: 6px; width: 76px; height: 44px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 60px; height: 28px; box-sizing: border-box; border: 1.5px solid #c9a24a; border-radius: 999px; background: #1f1512; box-shadow: 0 3px 0 #060302; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #e9dcc0"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #e9dcc0"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #e9dcc0"></span></span>
</span>
</button>

<!-- System buttons (small, out of the thumb's hot zone) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 40px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 1.5px solid #c9a24a; border-radius: 50%; background: #1f1512; box-shadow: 0 3px 0 #060302; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #e9dcc0; font-family: 'IM Fell English SC', serif; font-size: 20px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.MINUS.g}}"></span>
<span style="position: relative; margin-top: -1px">−</span>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 1128px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">

<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.PLUS.g}}"></span>
<span style="position: relative; margin-top: -1px">+</span>
</span>
</button>

<!-- Shoulders: on the thumb arc, above each cluster -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 24px; top: 250px; width: 112px; height: 56px; padding: 0; border: 2px solid #c9a24a; border-radius: 28px 28px 3px 3px; background: #1f1512; box-shadow: 0 4px 0 #060302; color: #e9dcc0; font-family: 'IM Fell English SC', serif; font-size: 22px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZL.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #8f1d1d"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZL.g}}"></span>
<span style="position: relative; ">ZL</span>
</button>
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 144px; top: 250px; width: 128px; height: 56px; padding: 0; border: 1.5px solid #8a6d36; border-radius: 3px; background: #170f0d; box-shadow: 0 4px 0 #060302; color: #e9dcc0; font-family: 'IM Fell English SC', serif; font-size: 20px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.L.y}}px)">

<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 1080px; top: 250px; width: 112px; height: 56px; padding: 0; border: 2px solid #c9a24a; border-radius: 28px 28px 3px 3px; background: #1f1512; box-shadow: 0 4px 0 #060302; color: #e9dcc0; font-family: 'IM Fell English SC', serif; font-size: 22px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZR.y}}px)">

<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 944px; top: 250px; width: 128px; height: 56px; padding: 0; border: 1.5px solid #8a6d36; border-radius: 3px; background: #170f0d; box-shadow: 0 4px 0 #060302; color: #e9dcc0; font-family: 'IM Fell English SC', serif; font-size: 20px; font-weight: 400; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.R.y}}px)">

<circle cx="60" cy="60" r="22" fill="none" stroke="#c9a24a" stroke-width="1" opacity="0.7"></circle>

<span aria-hidden="true" style="position: absolute; left: 63px; top: 63px; width: 58px; height: 58px; box-sizing: border-box; border-radius: 50%; border: 2px solid #6e5222; background: #c9a24a; box-shadow: inset -6px -5px 0 #9c7a33, 0 0 {{ls.glow}}px {{accent}}, 0 5px 0 #060302; transform: translate({{ls.x}}px, {{ls.y}}px)">

</span>

</sc-if>
<span aria-hidden="true" style="position: absolute; left: 323px; top: 573px; width: 14px; height: 14px; background: #c9a24a; transform: rotate(45deg)"></span>
<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 303px; top: 494px; width: 54px; height: 54px; padding: 0; border: 2px solid #c9a24a; border-radius: 4px; background: #1f1512; box-shadow: 0 4px 0 #060302; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.UP.y}}px)">

<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 303px; top: 612px; width: 54px; height: 54px; padding: 0; border: 2px solid #c9a24a; border-radius: 4px; background: #1f1512; box-shadow: 0 4px 0 #060302; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.DOWN.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.DOWN.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polyline points="5,8 11,15 17,8" fill="none" stroke="#e9dcc0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 244px; top: 553px; width: 54px; height: 54px; padding: 0; border: 2px solid #c9a24a; border-radius: 4px; background: #1f1512; box-shadow: 0 4px 0 #060302; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.LEFT.y}}px)">

<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 362px; top: 553px; width: 54px; height: 54px; padding: 0; border: 2px solid #c9a24a; border-radius: 4px; background: #1f1512; box-shadow: 0 4px 0 #060302; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.RIGHT.y}}px)">

<button type="button" aria-label="L3, left stick click" onPointerDown="{{h.L3.down}}" onPointerUp="{{h.L3.up}}" onPointerCancel="{{h.L3.up}}" onClick="{{h.L3.click}}" style="position: absolute; left: 276px; top: 360px; width: 52px; height: 52px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L3.y}}px)">

<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 72%); opacity: {{p.L3.o}}"></span>
<span style="position: relative; ">L3</span>
</span>
</button>

<!-- Right thumb: A/B/X/Y at rest, right stick inner-low, R3 beside it -->
<svg aria-hidden="true" width="228" height="228" viewBox="0 0 200 200" style="position: absolute; left: 932px; top: 316px">
<circle cx="100" cy="100" r="95" fill="none" stroke="#3a2a22" stroke-width="2"></circle><circle cx="100" cy="100" r="88" fill="none" stroke="#5a4426" stroke-width="1" stroke-dasharray="1.5 4"></circle>
</svg>
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 1012px; top: 334px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">

<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dotted #c9a24a; opacity: 0.8"></span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e0413a","options":["#e0413a","#c9a24a","#e9dcc0","#6fb6c8"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":1216,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 184;
    this.stickTravel = 39;
    this.state = { held: {}, last: 'AWAKEN', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 76;
    this.menuBounds = [-570, 570, -6, 710];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#e0413a';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.32 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 1.40).toFixed(1), glow: on ? 22 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
