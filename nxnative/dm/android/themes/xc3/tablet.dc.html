<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xenoblade Chronicles 3 — Tablet</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Saira+Condensed:wght@500;600;700&amp;display=swap">
<style>

button:focus-visible{outline:2px solid #5fe3ff;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 1216px; height: 760px; overflow: hidden; background: #070d1a; font-family: 'Saira Condensed', sans-serif; color: #eaf2ff; touch-action: none; user-select: none; -webkit-user-select: none">

<!-- Backdrop -->
<svg aria-hidden="true" width="1216" height="760" viewBox="0 0 1216 760" style="position: absolute; left: 0; top: 0"><circle cx="150" cy="470" r="250" fill="none" stroke="#12203a"></circle><circle cx="150" cy="470" r="300" fill="none" stroke="#0e1a30"></circle><circle cx="1066" cy="470" r="250" fill="none" stroke="#12203a"></circle><circle cx="1066" cy="470" r="300" fill="none" stroke="#0e1a30"></circle><line x1="0" y1="740" x2="1216" y2="740" stroke="#15243e"></line><circle cx="365" cy="190" r="1.2" fill="#4a6a92"></circle><circle cx="401" cy="684" r="1.2" fill="#4a6a92"></circle><circle cx="876" cy="152" r="1.2" fill="#4a6a92"></circle><circle cx="924" cy="669" r="1.2" fill="#4a6a92"></circle><circle cx="61" cy="684" r="1.2" fill="#4a6a92"></circle><circle cx="1167" cy="190" r="1.2" fill="#4a6a92"></circle><circle cx="1155" cy="646" r="1.2" fill="#4a6a92"></circle><circle cx="608" cy="228" r="1.2" fill="#4a6a92"></circle></svg>

<!-- Full-screen game placeholder -->
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 5px; color: #8ea3c2; opacity: 0.8">[ FULL-SCREEN GAME ]</span>
</div>
<sc-if value="{{showZones}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="1216" height="760" viewBox="0 0 1216 760" style="position: absolute; left: 0; top: 0">
<circle cx="0" cy="520" r="230" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="220"></circle><circle cx="0" cy="520" r="385" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="90"></circle><circle cx="0" cy="520" r="340" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="0" cy="520" r="430" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle><circle cx="1216" cy="520" r="230" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="220"></circle><circle cx="1216" cy="520" r="385" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="90"></circle><circle cx="1216" cy="520" r="340" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="1216" cy="520" r="430" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle>
</svg>
</sc-if>

<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 438px; top: 56px; width: 340px; height: 62px; box-sizing: border-box; padding: 7px 16px; border: 1px solid #2c4466; border-radius: 31px; background: #0c1628; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #9fb3cf">INPUT</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #9fb3cf">CHAIN ×{{stokes}}</span>
</div>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 1px; line-height: 28px; white-space: nowrap; overflow: hidden; color: {{accent}}">{{last}}</span>
</div>

<!-- Emulator settings: small oval, drag to move, tap to open -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 570px; top: 6px; width: 76px; height: 44px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 60px; height: 28px; box-sizing: border-box; border: 1.5px solid #6f8fb8; border-radius: 999px; background: #0c1628; box-shadow: 0 3px 0 #03060d; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #eaf2ff"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #eaf2ff"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #eaf2ff"></span></span>
</span>
</button>

<!-- System buttons (small, out of the thumb's hot zone) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 40px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 1.5px solid #6f8fb8; border-radius: 50%; background: #0c1628; box-shadow: 0 3px 0 #03060d; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #eaf2ff; font-family: 'Saira Condensed', sans-serif; font-size: 20px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.MINUS.g}}"></span>
<span style="position: relative; margin-top: -2px">−</span>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 1128px; top: 176px; width: 48px; height: 48px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">
<span style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; box-sizing: border-box; border: 1.5px solid #6f8fb8; border-radius: 50%; background: #0c1628; box-shadow: 0 3px 0 #03060d; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #eaf2ff; font-family: 'Saira Condensed', sans-serif; font-size: 20px; font-weight: 700; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.PLUS.g}}"></span>
<span style="position: relative; margin-top: -2px">+</span>
</span>
</button>

<!-- Shoulders: on the thumb arc, above each cluster -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 24px; top: 250px; width: 112px; height: 56px; padding: 0; border: 1px solid #3a5a82; border-radius: 6px; background: #0f1a2e; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; color: #eaf2ff; font-family: 'Cinzel', serif; font-size: 21px; font-weight: 700; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: skewX(-12deg) translateY({{p.ZL.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; background: {{accent}}; opacity: 0.75"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZL.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(12deg); ">ZL</span>
</button>
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 144px; top: 250px; width: 128px; height: 56px; padding: 0; border: 1px solid #2c4466; border-radius: 6px; background: #0c1628; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; color: #eaf2ff; font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: skewX(-12deg) translateY({{p.L.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 14px; width: 36px; bottom: 6px; height: 2px; background: #c9a85a"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(12deg); ">L</span>
</button>
<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 1080px; top: 250px; width: 112px; height: 56px; padding: 0; border: 1px solid #3a5a82; border-radius: 6px; background: #0f1a2e; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; color: #eaf2ff; font-family: 'Cinzel', serif; font-size: 21px; font-weight: 700; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: skewX(12deg) translateY({{p.ZR.y}}px)">
<span aria-hidden="true" style="position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; background: {{accent}}; opacity: 0.75"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZR.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(-12deg); ">ZR</span>
</button>
<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 944px; top: 250px; width: 128px; height: 56px; padding: 0; border: 1px solid #2c4466; border-radius: 6px; background: #0c1628; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; color: #eaf2ff; font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; letter-spacing: 2px; cursor: pointer; overflow: hidden; transform: skewX(12deg) translateY({{p.R.y}}px)">
<span aria-hidden="true" style="position: absolute; right: 14px; width: 36px; bottom: 6px; height: 2px; background: #c9a85a"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.R.g}}"></span>
<span style="position: relative; display: inline-block; transform: skewX(-12deg); ">R</span>
</button>

<!-- Left thumb: stick at rest, D-pad inner-low, L3 beside the stick -->
<button type="button" aria-label="Left stick" onPointerDown="{{ls.h.down}}" onPointerMove="{{ls.h.move}}" onPointerUp="{{ls.h.up}}" onPointerCancel="{{ls.h.up}}" style="position: absolute; left: 68px; top: 348px; width: 184px; height: 184px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed #eaf2ff; opacity: 0.3"></span>
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 164px; height: 164px; border-radius: 50%; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 66%); opacity: {{ls.o}}"></span>
<svg aria-hidden="true" width="136" height="136" viewBox="0 0 120 120" style="position: absolute; left: 24px; top: 24px; transform: rotate({{ls.r}}deg)">
<circle cx="60" cy="60" r="57" fill="#0c1628" stroke="#2c4466" stroke-width="1.5"></circle>
<circle cx="60" cy="60" r="50" fill="none" stroke="#3a5a82" stroke-width="5" stroke-dasharray="0.9 4.336"></circle>
<circle cx="60" cy="60" r="50" fill="none" stroke="#c9a85a" stroke-width="8" stroke-dasharray="1.6 24.58"></circle>
<circle cx="60" cy="60" r="40" fill="none" stroke="#1e3150" stroke-width="1"></circle>
</svg>
<span aria-hidden="true" style="position: absolute; left: 63px; top: 63px; width: 58px; height: 58px; box-sizing: border-box; border-radius: 50%; border: 2px solid #6f8fb8; background: #142339; box-shadow: inset 0 2px 0 #2f4a70, 0 0 {{ls.glow}}px {{accent}}, 0 5px 0 #03060d; transform: translate({{ls.x}}px, {{ls.y}}px)">
<span style="position: absolute; left: 12px; top: 12px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{accent}}; opacity: 0.85"></span>
<span style="position: absolute; left: 23px; top: 23px; width: 8px; height: 8px; border-radius: 50%; background: #eaf2ff"></span>
</span>
</button>
<sc-if value="{{showCaptions}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 92px; top: 512px; width: 136px; text-align: center; font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 4px; color: #9fb3cf">L-STICK</span>
</sc-if>
<span aria-hidden="true" style="position: absolute; left: 321px; top: 571px; width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid #c9a85a; transform: rotate(45deg)"></span>
<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 303px; top: 494px; width: 54px; height: 54px; padding: 0; border: 1px solid #3a5a82; border-radius: 10px 10px 4px 4px; background: #0f1a2e; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.UP.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.UP.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polyline points="5,14 11,7 17,14" fill="none" stroke="#eaf2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
</button>
<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 303px; top: 612px; width: 54px; height: 54px; padding: 0; border: 1px solid #3a5a82; border-radius: 4px 4px 10px 10px; background: #0f1a2e; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.DOWN.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.DOWN.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polyline points="5,8 11,15 17,8" fill="none" stroke="#eaf2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 244px; top: 553px; width: 54px; height: 54px; padding: 0; border: 1px solid #3a5a82; border-radius: 10px 4px 4px 10px; background: #0f1a2e; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.LEFT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.LEFT.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polyline points="14,5 7,11 14,17" fill="none" stroke="#eaf2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
</button>
<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 362px; top: 553px; width: 54px; height: 54px; padding: 0; border: 1px solid #3a5a82; border-radius: 4px 10px 10px 4px; background: #0f1a2e; box-shadow: inset 0 1px 0 #2f4a70, 0 4px 0 #03060d; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.RIGHT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.RIGHT.g}}"></span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 22 22" style="position: relative"><polyline points="8,5 15,11 8,17" fill="none" stroke="#eaf2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
</button>
<button type="button" aria-label="L3, left stick click" onPointerDown="{{h.L3.down}}" onPointerUp="{{h.L3.up}}" onPointerCancel="{{h.L3.up}}" onClick="{{h.L3.click}}" style="position: absolute; left: 276px; top: 360px; width: 52px; height: 52px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L3.y}}px)">
<span style="position: absolute; left: 3px; top: 3px; width: 46px; height: 46px; box-sizing: border-box; border: 2px solid #4a6a92; border-radius: 50%; background: #0c1628; box-shadow: inset 0 1px 0 #2f4a70, 0 5px 0 #03060d; color: #eaf2ff; font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 1px solid #2c4466"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid {{accent}}; opacity: {{p.L3.o}}"></span>

<span style="position: relative; ">L3</span>
</span>

<!-- Right thumb: A/B/X/Y at rest, right stick inner-low, R3 beside it -->
<svg aria-hidden="true" width="228" height="228" viewBox="0 0 200 200" style="position: absolute; left: 932px; top: 316px">
<circle cx="100" cy="100" r="96" fill="none" stroke="#1c2e4a" stroke-width="1"></circle><circle cx="100" cy="100" r="91" fill="none" stroke="#c9a85a" stroke-width="6" stroke-dasharray="1.4 46.25" opacity="0.7"></circle>
</svg>
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 1012px; top: 334px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 68px; height: 68px; box-sizing: border-box; border: 2px solid #4a6a92; border-radius: 50%; background: #0c1628; box-shadow: inset 0 1px 0 #2f4a70, 0 5px 0 #03060d; color: #eaf2ff; font-family: 'Cinzel', serif; font-size: 27px; font-weight: 700; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 1px solid #2c4466"></span>

<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 72%); opacity: {{p.X.o}}"></span>
<span style="position: relative; ">X</span>
</span>
</button>
<button type="button" aria-label="Y button" onPointerDown="{{h.Y.down}}" onPointerUp="{{h.Y.up}}" onPointerCancel="{{h.Y.up}}" onClick="{{h.Y.click}}" style="position: absolute; left: 950px; top: 396px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.Y.y}}px)">

<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 1px solid #2c4466"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid {{accent}}; opacity: {{p.Y.o}}"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 72%); opacity: {{p.Y.o}}"></span>
<span style="position: relative; ">Y</span>
</span>
</button>
<button type="button" aria-label="A button" onPointerDown="{{h.A.down}}" onPointerUp="{{h.A.up}}" onPointerCancel="{{h.A.up}}" onClick="{{h.A.click}}" style="position: absolute; left: 1074px; top: 396px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.A.y}}px)">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5fe3ff","options":["#5fe3ff","#ffd36b","#9ff0d8","#ff8fb1"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":1216,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 184;
    this.stickTravel = 39;
    this.state = { held: {}, last: 'READY', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 76;
    this.menuBounds = [-570, 570, -6, 710];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#5fe3ff';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.28 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 1.40).toFixed(1), glow: on ? 22 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
