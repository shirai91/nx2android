<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OCTOPATH TRAVELER 0 — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0b1030}
a{color:#e8bd5c}a:hover{color:#e8bd5c}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #e8bd5c;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 915px; height: 412px; overflow: hidden; background: #0b1030; font-family: 'Cinzel', serif; color: #f2e6c8; touch-action: none; user-select: none; -webkit-user-select: none">

<!-- Backdrop -->
<svg aria-hidden="true" width="915" height="412" viewBox="0 0 915 412" style="position: absolute; left: 0; top: 0">
<defs>
<radialGradient id="octoSky" cx="50%" cy="18%" r="78%">
<stop offset="0%" stop-color="#1d2a63"></stop>
<stop offset="55%" stop-color="#101742"></stop>
<stop offset="100%" stop-color="#070a22"></stop>
</radialGradient>
</defs>
<rect x="0" y="0" width="915" height="412" fill="url(#octoSky)"></rect>
<circle cx="457" cy="60" r="180" fill="none" stroke="#e8bd5c" stroke-width="1" opacity="0.12"></circle>
<circle cx="457" cy="60" r="250" fill="none" stroke="#e8bd5c" stroke-width="1" opacity="0.07"></circle>
<path d="M120 40 L124 54 L138 58 L124 62 L120 76 L116 62 L102 58 L116 54 Z" fill="#ffe6a8" opacity="0.5"></path>
<path d="M780 300 L783 310 L793 313 L783 316 L780 326 L777 316 L767 313 L777 310 Z" fill="#ffe6a8" opacity="0.35"></path>
<path d="M300 300 L302 308 L310 310 L302 312 L300 320 L298 312 L290 310 L298 308 Z" fill="#ffe6a8" opacity="0.3"></path>
<path d="M640 70 L642 77 L649 79 L642 81 L640 88 L638 81 L631 79 L638 77 Z" fill="#ffe6a8" opacity="0.25"></path>
</svg>

<!-- Full-screen game placeholder -->
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<span style="font-family: 'Cinzel', serif; font-size: 15px; font-weight: 600; letter-spacing: 6px; color: #8d97c4; opacity: 0.8">[ FULL-SCREEN GAME ]</span>
</div>
<sc-if value="{{showZones}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="915" height="412" viewBox="0 0 915 412" style="position: absolute; left: 0; top: 0">
<circle cx="24" cy="372" r="175" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="150"></circle><circle cx="24" cy="372" r="290" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="80"></circle><circle cx="24" cy="372" r="250" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="24" cy="372" r="330" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle><circle cx="891" cy="372" r="175" fill="none" stroke="rgba(72,214,140,0.18)" stroke-width="150"></circle><circle cx="891" cy="372" r="290" fill="none" stroke="rgba(255,184,64,0.12)" stroke-width="80"></circle><circle cx="891" cy="372" r="250" fill="none" stroke="rgba(40,170,100,0.7)" stroke-width="1.5" stroke-dasharray="6 6"></circle><circle cx="891" cy="372" r="330" fill="none" stroke="rgba(220,140,30,0.7)" stroke-width="1.5" stroke-dasharray="4 8"></circle>
</svg>
</sc-if>

<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 330px; top: 40px; width: 255px; height: 48px; box-sizing: border-box; padding: 3px 14px; border: 1px solid rgba(232,189,92,0.55); border-radius: 10px; background: rgba(8,11,34,0.78); box-shadow: 0 0 18px rgba(232,189,92,0.12); display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600; letter-spacing: 3px; color: #9aa4d0">INPUT</span>
<span style="font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600; letter-spacing: 3px; color: #9aa4d0">PRESSES ×{{stokes}}</span>
</div>
<span style="font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; letter-spacing: 1px; line-height: 22px; white-space: nowrap; overflow: hidden; color: {{accent}}">{{last}}</span>
</div>

<!-- Emulator settings: small oval, drag to move, tap to open -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 425px; top: 2px; width: 64px; height: 36px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 7px; top: 7px; width: 50px; height: 22px; box-sizing: border-box; border: 1.5px solid #e8bd5c; border-radius: 999px; background: rgba(8,11,34,0.80); box-shadow: 0 0 12px rgba(232,189,92,0.18); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 3px"><span style="display: block; width: 18px; height: 2px; border-radius: 2px; background: #e8bd5c"></span><span style="display: block; width: 18px; height: 2px; border-radius: 2px; background: #e8bd5c"></span><span style="display: block; width: 18px; height: 2px; border-radius: 2px; background: #e8bd5c"></span></span>
</span>
</button>

<!-- System buttons (small, out of the thumb's hot zone) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 282px; top: 10px; width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 7px; top: 7px; width: 26px; height: 26px; box-sizing: border-box; border: 1.5px solid #e8bd5c; border-radius: 50%; background: rgba(8,11,34,0.80); box-shadow: 0 0 10px rgba(232,189,92,0.14); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #e8bd5c; font-family: 'Cinzel', serif; font-size: 17px; font-weight: 600; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, #ffe6a8 0%, {{accent}} 70%); opacity: {{p.MINUS.g}}"></span>
<span style="position: relative; margin-top: -1px">−</span>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 593px; top: 10px; width: 40px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">
<span style="position: absolute; left: 7px; top: 7px; width: 26px; height: 26px; box-sizing: border-box; border: 1.5px solid #e8bd5c; border-radius: 50%; background: rgba(8,11,34,0.80); box-shadow: 0 0 10px rgba(232,189,92,0.14); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #e8bd5c; font-family: 'Cinzel', serif; font-size: 17px; font-weight: 600; line-height: 1">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, #ffe6a8 0%, {{accent}} 70%); opacity: {{p.PLUS.g}}"></span>
<span style="position: relative; margin-top: -1px">+</span>
</span>
</button>

<!-- Shoulders: on the thumb arc, above each cluster -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 16px; top: 104px; width: 96px; height: 50px; padding: 0; border: 2px solid #e8bd5c; border-radius: 14px 8px 8px 14px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.22); color: #f2e6c8; font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZL.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.ZL.g}}"></span>
<span style="position: relative; ">ZL</span>
</button>
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 120px; top: 104px; width: 108px; height: 50px; padding: 0; border: 2px solid #e8bd5c; border-radius: 14px 8px 8px 14px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.22); color: #f2e6c8; font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.L.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.L.g}}"></span>
<span style="position: relative; ">L</span>
</button>
<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 803px; top: 104px; width: 96px; height: 50px; padding: 0; border: 2px solid #e8bd5c; border-radius: 8px 14px 14px 8px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.22); color: #f2e6c8; font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.ZR.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.ZR.g}}"></span>
<span style="position: relative; ">ZR</span>
</button>
<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 687px; top: 104px; width: 108px; height: 50px; padding: 0; border: 2px solid #e8bd5c; border-radius: 8px 14px 14px 8px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.22); color: #f2e6c8; font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; letter-spacing: 3px; cursor: pointer; overflow: hidden; transform: translateY({{p.R.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.R.g}}"></span>
<span style="position: relative; ">R</span>
</button>

<!-- Left thumb: stick at rest, D-pad inner-low, L3 beside the stick -->
<button type="button" aria-label="Left stick" onPointerDown="{{ls.h.down}}" onPointerMove="{{ls.h.move}}" onPointerUp="{{ls.h.up}}" onPointerCancel="{{ls.h.up}}" style="position: absolute; left: 50px; top: 182px; width: 160px; height: 160px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(232,189,92,0.45); opacity: 0.55"></span>
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 66%); opacity: {{ls.o}}"></span>
<svg aria-hidden="true" width="116" height="116" viewBox="0 0 120 120" style="position: absolute; left: 22px; top: 22px; transform: rotate({{ls.r}}deg)">
<circle cx="60" cy="60" r="57" fill="rgba(8,11,34,0.55)" stroke="#e8bd5c" stroke-width="1.6"></circle>
<circle cx="60" cy="60" r="50" fill="none" stroke="rgba(232,189,92,0.28)" stroke-width="1" stroke-dasharray="3 7"></circle>
<path d="M60 14 L64 30 L60 26 L56 30 Z" fill="#e8bd5c" opacity="0.85"></path>
<path d="M60 106 L64 90 L60 94 L56 90 Z" fill="#e8bd5c" opacity="0.35"></path>
<path d="M14 60 L30 64 L26 60 L30 56 Z" fill="#e8bd5c" opacity="0.35"></path>
<path d="M106 60 L90 64 L94 60 L90 56 Z" fill="#e8bd5c" opacity="0.35"></path>
</svg>
<span aria-hidden="true" style="position: absolute; left: 55px; top: 55px; width: 49px; height: 49px; box-sizing: border-box; border-radius: 50%; border: 2px solid #e8bd5c; background: radial-gradient(circle at 50% 28%, #35438f 0%, #0a0e2a 78%); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.55), 0 0 {{ls.glow}}px {{accent}}, 0 4px 0 rgba(0,0,0,0.5); transform: translate({{ls.x}}px, {{ls.y}}px)">
<span style="position: absolute; left: 8px; top: 5px; width: 22px; height: 10px; border-radius: 99px; background: radial-gradient(ellipse at 50% 50%, rgba(255,230,168,0.85) 0%, rgba(255,230,168,0) 70%)"></span>
</span>
</button>
<sc-if value="{{showCaptions}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 72px; top: 324px; width: 116px; text-align: center; font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; color: #9aa4d0">L-STICK</span>
</sc-if>
<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 269px; top: 253px; width: 46px; height: 46px; padding: 0; border: 2px solid #e8bd5c; border-radius: 10px 10px 3px 3px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.20); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.UP.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.UP.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><path d="M11 4 L19 16 L11 12.6 L3 16 Z" fill="#e8bd5c"></path></svg>
</button>
<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 269px; top: 353px; width: 46px; height: 46px; padding: 0; border: 2px solid #e8bd5c; border-radius: 3px 3px 10px 10px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.20); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.DOWN.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.DOWN.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><path d="M11 18 L3 6 L11 9.4 L19 6 Z" fill="#e8bd5c"></path></svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 219px; top: 303px; width: 46px; height: 46px; padding: 0; border: 2px solid #e8bd5c; border-radius: 10px 3px 3px 10px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.20); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.LEFT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.LEFT.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><path d="M4 11 L16 3 L12.6 11 L16 19 Z" fill="#e8bd5c"></path></svg>
</button>
<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 319px; top: 303px; width: 46px; height: 46px; padding: 0; border: 2px solid #e8bd5c; border-radius: 3px 10px 10px 3px; background: linear-gradient(180deg, #1b2a5e 0%, #0a0e2a 100%); box-shadow: 0 4px 0 rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,168,0.20); cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transform: translateY({{p.RIGHT.y}}px)">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.RIGHT.g}}"></span>
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 22 22" style="position: relative"><path d="M18 11 L6 3 L9.4 11 L6 19 Z" fill="#e8bd5c"></path></svg>
</button>
<button type="button" aria-label="L3, left stick click" onPointerDown="{{h.L3.down}}" onPointerUp="{{h.L3.up}}" onPointerCancel="{{h.L3.up}}" onClick="{{h.L3.click}}" style="position: absolute; left: 230px; top: 178px; width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L3.y}}px)">
<span style="position: absolute; left: 2px; top: 2px; width: 40px; height: 40px; box-sizing: border-box; border: 2px solid #e8bd5c; border-radius: 50%; background: radial-gradient(circle at 50% 28%, #35438f 0%, #0a0e2a 78%); box-shadow: 0 4px 0 rgba(0,0,0,0.5); color: #e8bd5c; font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,238,190,0.95) 0%, {{accent}} 45%, rgba(150,104,30,0.95) 100%); opacity: {{p.L3.g}}"></span>
<span style="position: relative; ">L3</span>
</span>
</button>

<!-- Right thumb: A/B/X/Y at rest, right stick inner-low, R3 beside it -->
<svg aria-hidden="true" width="192" height="192" viewBox="0 0 192 192" style="position: absolute; left: 674px; top: 172px">
<circle cx="96" cy="96" r="90" fill="none" stroke="#e8bd5c" stroke-width="1.4" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.5"></circle>
<circle cx="96" cy="96" r="80" fill="none" stroke="#e8bd5c" stroke-width="1" opacity="0.22"></circle>
<path d="M96 4 L100 14 L96 11 L92 14 Z" fill="#e8bd5c" opacity="0.55"></path>
<path d="M96 188 L100 178 L96 181 L92 178 Z" fill="#e8bd5c" opacity="0.25"></path>
<path d="M4 96 L14 100 L11 96 L14 92 Z" fill="#e8bd5c" opacity="0.25"></path>
<path d="M188 96 L178 100 L181 96 L178 92 Z" fill="#e8bd5c" opacity="0.25"></path>
</svg>
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 740px; top: 184px; width: 60px; height: 60px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 60px; height: 60px; box-sizing: border-box; border: 2px solid #e8bd5c; border-radius: 50%; background: radial-gradient(circle at 50% 26%, #35438f 0%, #0a0e2a 78%); box-shadow: 0 4px 0 rgba(0,0,0,0.5), inset 0 0 0 2px rgba(95,212,196,0.22); color: #5fd4c4; font-family: 'Cinzel', serif; font-size: 23px; font-weight: 700; text-shadow: 0 0 10px rgba(95,212,196,0.55); overflow: hidden; display: flex; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; left: 13px; top: 6px; width: 34px; height: 12px; border-radius: 99px; background: radial-gradient(ellipse at 50% 50%, rgba(255,230,168,0.8) 0%, rgba(255,230,168,0) 70%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 50% 32%, rgba(255,240,200,0.95) 0%, {{accent}} 70%); opacity: {{p.X.g}}"></span>
<span style="position: relative; ">X</span>
</span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e8bd5c","options":["#e8bd5c","#7fd4ff","#ff9d7a","#9be08a"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":915,"height":412}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 160;
    this.stickTravel = 34;
    this.state = { held: {}, last: 'THE PATH BECKONS', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 64;
    this.menuBounds = [-425, 426, -2, 374];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#e8bd5c';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.5 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 4.20).toFixed(1), glow: on ? 12 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
