<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 438px; top: 56px; width: 340px; height: 62px; box-sizing: border-box; padding: 7px 16px; border: 1px solid #c9a35a; border-radius: 2px 16px 2px 16px; background: #17141a; box-shadow: 0 4px 0 #030203; display: flex; flex-direction: column; justify-content: center; gap: 0px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Cormorant SC', serif; font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #a99f92">INPUT</span>
<span style="font-family: 'Cormorant SC', serif; font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #a99f92">STITCH ×{{stokes}}</span>
</div>
<span style="font-family: 'Cormorant SC', serif; font-size: 24px; font-weight: 700; letter-spacing: 1px; line-height: 28px; white-space: nowrap; overflow: hidden; color: {{accent}}">{{last}}</span>
</div>

<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 570px; top: 6px; width: 76px; height: 44px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">

<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #ece4d4"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #ece4d4"></span><span style="display: block; width: 22px; height: 2px; border-radius: 2px; background: #ece4d4"></span></span>
</span>

<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 72%); opacity: {{p.L3.o}}"></span>
<span style="position: relative; ">L3</span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e03a4e","options":["#e03a4e","#ece4d4","#c9a35a","#7fd3c9"]},"showCaptions":{"editor":"boolean","default":true},"showZones":{"editor":"boolean","default":false},"opacity":{"editor":"range","default":0.9,"min":0.3,"max":1,"step":0.05},"$preview":{"width":1216,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.stickSize = 184;
    this.stickTravel = 39;
    this.state = { held: {}, last: 'SPOOLED', stokes: 0, ls: { x: 0, y: 0 }, rs: { x: 0, y: 0 }, menu: { x: 0, y: 0 }, menuHeld: false };
    this.menuW = 76;
    this.menuBounds = [-570, 570, -6, 710];
    this._centers = {};
  }

  names() {
    return {
      ZL: 'ZL', L: 'L', ZR: 'ZR', R: 'R', MINUS: 'MINUS', PLUS: 'PLUS',
      UP: 'D-PAD UP', DOWN: 'D-PAD DOWN', LEFT: 'D-PAD LEFT', RIGHT: 'D-PAD RIGHT',
      A: 'A', B: 'B', X: 'X', Y: 'Y', L3: 'L3 · STICK CLICK', R3: 'R3 · STICK CLICK',
      LS: 'L-STICK', RS: 'R-STICK'
    };
  }

  press(id) {
    const s = this.state;
    const held = Object.assign({}, s.held);
    held[id] = true;
    this.setState({ held: held, last: this.names()[id], stokes: s.stokes + 1 });
  }

  release(id) {
    const s = this.state;
    if (!s.held[id]) return;
    const held = Object.assign({}, s.held);
    held[id] = false;
    this.setState({ held: held });
  }

  moveStick(id, key, e) {
    const c = this._centers[key];
    if (!c) return;
    let dx = (e.clientX - c.x) / c.k;
    let dy = (e.clientY - c.y) / c.k;
    const max = this.stickTravel;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / max).toFixed(2);
    const patch = { last: this.names()[id] + '  ' + f(dx) + ' ' + f(-dy) };
    patch[key] = { x: dx, y: dy };
    this.setState(patch);
  }

  stick(id, key) {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._centers[key] = { x: r.left + r.width / 2, y: r.top + r.height / 2, k: (r.width / this.stickSize) || 1 };
        this.press(id);
        this.moveStick(id, key, e);
      },
      move: (e) => {
        if (this.state.held[id]) this.moveStick(id, key, e);
      },
      up: () => {
        const s = this.state;
        const held = Object.assign({}, s.held);
        held[id] = false;
        const patch = { held: held };
        patch[key] = { x: 0, y: 0 };
        this.setState(patch);
      }
    };
  }

  menuHandlers() {
    return {
      down: (e) => {
        const el = e.currentTarget;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const r = el.getBoundingClientRect();
        this._menu = { sx: e.clientX, sy: e.clientY, ox: this.state.menu.x, oy: this.state.menu.y, k: (r.width / this.menuW) || 1, moved: false };
        this.setState({ menuHeld: true });
      },
      move: (e) => {
        const m = this._menu;
        if (!m) return;
        const dx = (e.clientX - m.sx) / m.k;
        const dy = (e.clientY - m.sy) / m.k;
        if (!m.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        m.moved = true;
        const b = this.menuBounds;
        this.setState({ menu: { x: Math.max(b[0], Math.min(b[1], m.ox + dx)), y: Math.max(b[2], Math.min(b[3], m.oy + dy)) } });
      },
      up: () => {
        const m = this._menu;
        this._menu = null;
        this.setState({ menuHeld: false, last: m && !m.moved ? 'EMULATOR MENU' : this.state.last });
      },
      click: (e) => {
        if (e && e.detail === 0) this.setState({ last: 'EMULATOR MENU' });
      }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#e03a4e';
    const s = this.state;
    const ids = ['ZL', 'L', 'ZR', 'R', 'MINUS', 'PLUS', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'A', 'B', 'X', 'Y', 'L3', 'R3'];
    const p = {};
    const h = {};
    ids.forEach((id) => {
      const on = !!s.held[id];
      p[id] = { o: on ? 1 : 0, g: on ? 0.3 : 0, y: on ? 3 : 0 };
      h[id] = {
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.press(id);
        },
        up: () => this.release(id),
        click: (e) => {
          if (e && e.detail === 0) {
            this.press(id);
            setTimeout(() => this.release(id), 140);
          }
        }
      };
    });
    const mk = (id, key) => {
      const v = s[key];
      const on = !!s.held[id];
      return { x: v.x.toFixed(1), y: v.y.toFixed(1), r: (v.x * 1.40).toFixed(1), glow: on ? 22 : 0, o: on ? 0.8 : 0, h: this.stick(id, key) };
    };
    return {
      accent: accent,
      last: s.last,
      stokes: String(s.stokes).padStart(3, '0'),
      p: p,
      h: h,
      ls: mk('LS', 'ls'),
      rs: mk('RS', 'rs'),
      menu: { x: s.menu.x.toFixed(1), y: s.menu.y.toFixed(1), o: s.menuHeld ? 1 : 0, h: this.menuHandlers() },
      showCaptions: this.props.showCaptions ?? true,
      showZones: this.props.showZones ?? false,
      op: this.props.opacity ?? 0.9
    };
  }
}
</script>
